name: CI

# Se comprueba en cada empujón a las ramas de trabajo y en cada propuesta de
# cambio. `npm run verify` es el mismo comando que se usa en local: si pasa
# aquí y no allí (o al revés) es que algo depende del entorno, y eso es un
# fallo en sí mismo.
on:
  push:
    branches: [main, "claude/**"]
  pull_request:

# Un empujón nuevo cancela la comprobación anterior de la misma rama: no tiene
# sentido gastar minutos verificando un commit que ya quedó atrás.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Solo lectura: verificar no escribe nada. Sin esto el token hereda los
# permisos por defecto del repo, que pueden ser de escritura, y cualquier
# dependencia que se ejecute en `npm ci` o en las pruebas los tendría.
permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` y no `npm install`: instala exactamente lo que dice
      # package-lock.json y falla si los dos archivos no concuerdan.
      - run: npm ci

      # Antes que nada: si una dependencia tiene un fallo conocido, conviene
      # saberlo aunque el resto pase. `--audit-level=high` a propósito — con
      # `low` esto se pondría rojo por cosas que no afectan a una app sin
      # servidor propio, y un CI que se ignora no sirve de nada.
      #
      # Bloquea solo lo que se publica (`--omit=dev`). Las herramientas de
      # desarrollo se auditan aparte sin bloquear: `braces`, que llega con
      # eslint-config-next, tiene un aviso alto en TODAS sus versiones y no hay
      # a qué actualizar; dejarlo bloqueando dejaba el CI rojo sin arreglo.
      - name: Vulnerabilidades
        run: npm audit --omit=dev --audit-level=high

      - name: Vulnerabilidades (herramientas de desarrollo, solo aviso)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Tipos
        run: npm run typecheck

      - name: Estilo
        run: npm run lint

      - name: Pruebas
        run: npm run test

      # El que de verdad atrapa los fallos: este proyecto ya se cayó en
      # producción con un 500 porque hls.js y mpegts.js llegaron al paquete del
      # servidor. Solo `next build` lo detecta.
      #
      # Se compila **sin secretos** a propósito: la app tiene que salir
      # adelante recién clonada, cayendo a la lista M3U por defecto y al
      # catálogo local. Si algún día deja de ser así, se entera aquí y no un
      # vecino con la pantalla en negro.
      - name: Compilación
        run: npm run build
        env:
          M3U_URL: ""
          TMDB_API_KEY: ""

  # Varios aparatos a la vez contra la app compilada: lo que solo se rompe
  # ENTRE aparatos (Ver juntos). Aparte del trabajo de arriba para que un
  # fallo aquí no tape uno de tipos o de pruebas, y al revés.
  navegador:
    runs-on: ubuntu-latest
    # Las pruebas tardan ~2 min; el resto del margen es para instalar las
    # librerías de sistema de WebKit (~170 paquetes), que con un espejo de apt
    # lento ya se comió 15 minutos sin llegar a ejecutar ninguna prueba.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # WebKit es el motor de Safari: pinta como el iPhone (ver playwright.config.ts).
      - name: Chromium y WebKit de pruebas
        run: npx playwright install --with-deps chromium webkit

      - name: Pruebas de navegador
        run: npm run e2e
