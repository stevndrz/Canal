# Actualizaciones de dependencias.
#
# El CI ya corre `npm audit` en cada cambio, pero eso solo avisa de lo que ya
# está: para que llegue el arreglo hace falta que alguien suba la versión, y
# esto lo hace sin que nadie se acuerde.
#
# Semanal y agrupado a propósito. Este proyecto es de una persona y el ruido de
# un PR por paquete acabaría en no mirar ninguno; una tanda a la semana sí se
# revisa. Las de seguridad no esperan a la tanda: Dependabot las manda aparte
# en cuanto se publican.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Menor y parche, agrupados: "si rompe algo, rompe el CI y ya está" solo
      # vale cuando el CI de verdad puede quedar en rojo un rato sin molestar a
      # nadie. Una mayor no es eso — mezclar TypeScript 5→7, ESLint 9→10 y
      # Vitest 3→5 en el mismo PR tumbó el CI y no había forma de saber cuál de
      # los tres lo rompió sin deshacerlos uno a uno. Cada mayor sale ahora en
      # su propio PR (sin agrupar, es el comportamiento por defecto), y se
      # prueba y se descarta sola.
      desarrollo:
        dependency-type: development
        update-types: [minor, patch]
      # Lo de producción, igual: un parche se fusiona leyendo el diff, una
      # versión mayor de `next` o `hls.js` se prueba en la tele, cada una por
      # su cuenta.
      produccion-menores:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
