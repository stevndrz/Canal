# 2 GB: compilar un proyecto de un solo módulo no necesita más, y el valor por
# defecto de Gradle se queda corto en las máquinas con poca memoria.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true

# AndroidX es obligatorio desde hace años; sin estas dos líneas la compilación
# falla con un error que no menciona ninguna de las dos.
android.useAndroidX=true
kotlin.code.style=official

# Sin recursos que no se usen y sin BuildConfig: la cáscara es una Activity y
# una WebView, y el APK baja de 3 MB.
android.nonTransitiveRClass=true
